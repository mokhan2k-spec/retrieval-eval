[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieval-eval"
version = "0.1.0"
description = "Fail-closed BEIR evaluation harness: BM25, dense, RRF hybrid and cross-encoder rerank, with paired significance tests."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "httpx>=0.27"]

[project.optional-dependencies]
# Heavy, model-running dependencies. Tests and CI never need these.
models = ["bm25s>=0.2", "PyStemmer>=2.2", "sentence-transformers>=3.0", "huggingface_hub"]
dev = ["pytest>=8,<9", "mutmut==3.3.1", "scikit-learn>=1.4", "ir-measures>=0.3.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mutmut]
# The whole package is copied so the tests can import it; only metrics.py,
# stats.py and runner.py are mutated.
paths_to_mutate = ["src/retrieval_eval/"]
do_not_mutate = [
  "src/retrieval_eval/__init__.py",
  "src/retrieval_eval/__main__.py",
  "src/retrieval_eval/cli.py",
  "src/retrieval_eval/config.py",
  "src/retrieval_eval/data.py",
  "src/retrieval_eval/judge.py",
  "src/retrieval_eval/kappa.py",
  "src/retrieval_eval/labels.py",
  "src/retrieval_eval/pipeline.py",
  "src/retrieval_eval/report.py",
  "src/retrieval_eval/rerank.py",
  "src/retrieval_eval/retrievers.py",
]
tests_dir = ["tests/"]
debug = true
